# Defaults for 32-bit Windows programs (the default target).  Loaded after
# clang.cfg whenever the target is i686-w64-windows-gnu (= i686-w64-mingw32).
#
# Headers and libraries come from the toolchain's own directory, never from
# some other gcc that happens to be on PATH.
--sysroot=<CFGDIR>/..
# GNU ld is not part of this toolchain
-fuse-ld=lld
# libgcc, libstdc++ and winpthreads are not on XP: link them in
-static
# GCC's libstdc++ is built on winpthreads; gcc adds this itself, clang does
# not (lld finds archives in any order, so the position does not matter)
-lpthread
# XP's loader refuses executables marked for a newer Windows (lld's default
# is 6.0, Vista)
-Wl,--major-os-version=5,--minor-os-version=1
-Wl,--major-subsystem-version=5,--minor-subsystem-version=1
# declare only what XP's system DLLs provide
-D_WIN32_WINNT=0x0501
-DWINVER=0x0501
